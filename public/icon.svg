<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Topographic Contour Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- Mountain / Terrain Contours (Flood Basin) -->
  <path d="M 80 390 L 180 260 L 260 330 L 360 210 L 432 390 Z" fill="#0f2b48" opacity="0.6" />
  <path d="M 120 390 L 210 290 L 270 340 L 340 270 L 410 390 Z" fill="#0c4a6e" opacity="0.7" />

  <!-- Water Flood Reservoir / Waves -->
  <path d="M 64 350 C 130 330 180 370 256 345 C 332 320 390 360 448 340 L 448 420 C 448 435 436 448 420 448 L 92 448 C 76 448 64 435 64 420 Z" fill="url(#waterGrad)" />
  <path d="M 64 380 C 140 360 190 395 260 375 C 330 355 385 385 448 368 L 448 440 C 448 444 444 448 440 448 L 72 448 C 68 448 64 444 64 440 Z" fill="url(#waveGrad2)" />

  <!-- Hydro Water Droplet Core with GIS Pin Overlay -->
  <g filter="url(#shadow)">
    <!-- Water Droplet Outer Glow -->
    <path d="M 256 100 C 256 100 160 230 160 300 C 160 353 203 396 256 396 C 309 396 352 353 352 300 C 352 230 256 100 256 100 Z" fill="#ffffff" opacity="0.95" />
    
    <!-- Droplet Inner Gradient -->
    <path d="M 256 116 C 256 116 172 236 172 300 C 172 346 210 384 256 384 C 302 384 340 346 340 300 C 340 236 256 116 256 116 Z" fill="url(#waterGrad)" />

    <!-- Droplet Highlight / Specular Reflection -->
    <path d="M 220 220 C 205 250 202 280 206 310 C 196 295 194 270 204 240 C 210 224 220 205 230 185 C 224 198 221 210 220 220 Z" fill="#ffffff" opacity="0.8" />
    
    <!-- Internal GIS Wave Lines -->
    <path d="M 195 305 C 220 295 240 315 265 305 C 290 295 310 305 320 300" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 205 330 C 225 322 245 338 270 330 C 288 324 300 330 310 327" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>
</svg>
