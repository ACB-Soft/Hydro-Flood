<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091426" />
      <stop offset="45%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="maskWaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="maskWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </linearGradient>
    <filter id="maskShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full-bleed background (no border-radius for maskable safe padding) -->
  <rect width="512" height="512" fill="url(#maskBgGrad)" />

  <!-- Topographic Contour Rings inside Safe Zone -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />

  <!-- Lower Flood Water Wave in Safe Zone -->
  <path d="M 0 380 C 120 350 180 390 256 365 C 330 340 390 380 512 360 L 512 512 L 0 512 Z" fill="url(#maskWaveGrad)" />

  <!-- Hydro Droplet centered in 80% safe zone (center: 256, radius <= 200) -->
  <g filter="url(#maskShadow)">
    <path d="M 256 120 C 256 120 176 226 176 288 C 176 332 212 368 256 368 C 300 368 336 332 336 288 C 336 226 256 120 256 120 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 256 132 C 256 132 186 232 186 288 C 186 326 217 358 256 358 C 295 358 326 326 326 288 C 326 232 256 132 256 132 Z" fill="url(#maskWaterGrad)" />
    
    <!-- Droplet Highlight -->
    <path d="M 225 215 C 213 240 210 266 214 290 C 206 278 204 258 212 232 C 218 218 225 202 234 186 C 228 197 226 206 225 215 Z" fill="#ffffff" opacity="0.85" />

    <!-- Wave Lines -->
    <path d="M 205 292 C 226 284 242 300 264 292 C 285 284 300 292 310 288" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 215 314 C 230 307 248 320 268 314 C 282 309 294 314 302 311" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>
</svg>
