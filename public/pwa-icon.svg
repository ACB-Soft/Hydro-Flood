<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Main Water Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Secondary Water Drop Gradient -->
    <linearGradient id="smallDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ambient Cyan Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow for Depth -->
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Base (Squircle style for mobile & desktop PWA) -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4" />

  <!-- Soft Ambient Water Glow -->
  <circle cx="256" cy="270" r="190" fill="url(#ambientGlow)" />

  <!-- Droplets Icon Group -->
  <g filter="url(#dropShadow)">
    <!-- Main Large Water Drop -->
    <path d="M 236 112 C 236 112 136 246 136 322 C 136 380 183 426 242 426 C 301 426 348 380 348 322 C 348 246 248 112 248 112 C 245 107 239 107 236 112 Z" fill="url(#dropGrad)" />

    <!-- Specular Highlight Curve -->
    <path d="M 205 258 C 195 284 190 316 198 342 C 200 348 194 353 188 350 C 183 348 180 343 179 337 C 171 306 177 269 193 239 C 197 232 206 235 208 241 C 209 247 207 253 205 258 Z" fill="#ffffff" opacity="0.5" />

    <!-- Secondary Small Water Drop -->
    <path d="M 348 152 C 348 152 306 216 306 248 C 306 272 325 292 348 292 C 371 292 390 272 390 248 C 390 216 348 152 348 152 Z" fill="url(#smallDropGrad)" opacity="0.95" />
    
    <!-- Small Drop Highlight -->
    <path d="M 334 220 C 330 230 328 242 332 252 C 333 255 330 257 327 256 C 324 255 322 252 321 249 C 318 238 320 225 327 215 C 329 212 333 213 334 216 C 335 217 335 219 334 220 Z" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
