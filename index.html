<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>HydroFlood - Hidrolojik Taşkın Analizi & CBS</title>
    <meta name="description" content="Gelişmiş hidrolojik taşkın analizi, DGN/DWG harita görüntüleyici ve coğrafi bilgi sistemi" />
    <meta name="theme-color" content="#06b6d4" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 48px; height: 48px; border: 4px solid #1e293b; border-top-color: #06b6d4; border-radius: 50%; animation: hf-spin 1s linear infinite;"></div>
        <h1 style="margin-top: 20px; font-size: 18px; font-weight: 600; letter-spacing: 0.025em; color: #f1f5f9;">HydroFlood CBS</h1>
        <p style="margin-top: 8px; font-size: 13px; color: #94a3b8;">Uygulama yükleniyor, lütfen bekleyin...</p>
        <style>
          @keyframes hf-spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('Uygulama yükleniyor') !== -1)) {
          var msg = e && e.message ? e.message : 'Bilinmeyen başlatma hatası';
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;padding:20px;font-family:sans-serif;">' +
            '<div style="max-width:540px;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;color:#f8fafc;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
            '<h2 style="margin:0 0 12px;color:#38bdf8;font-size:18px;font-weight:700;">HydroFlood Başlatma Bildirimi</h2>' +
            '<p style="color:#cbd5e1;font-size:14px;line-height:1.5;margin-bottom:16px;">Önizleme çerçevesinde veya tarayıcı güvenlik ayarlarında çerez/çerçeve kısıtlaması nedeniyle yükleme gecikmiş olabilir.</p>' +
            '<pre style="background:#0f172a;color:#f87171;padding:12px;border-radius:6px;font-size:12px;overflow:auto;max-height:120px;white-space:pre-wrap;">' + msg + '</pre>' +
            '<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">' +
            '<button onclick="location.reload()" style="background:#06b6d4;color:#0f172a;padding:10px 18px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Yeniden Yükle</button>' +
            '<button onclick="window.open(location.href, \'_blank\')" style="background:#334155;color:#f8fafc;padding:10px 18px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Yeni Sekmede Aç</button>' +
            '</div>' +
            '</div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
